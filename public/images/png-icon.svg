<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="w-6 h-6">
  <!-- Drop shadow -->
  <rect x="9" y="5" width="40" height="52" rx="4" ry="4" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Document background -->
  <rect x="8" y="4" width="40" height="52" rx="4" ry="4" fill="#f8f8f8" stroke="#d0d0d0" stroke-width="1"/>
  
  <!-- Folded corner -->
  <path d="M40 4 L48 12 L40 12 Z" fill="#e8e8e8" stroke="#d0d0d0" stroke-width="0.5"/>
  <path d="M40 4 L40 12 L48 12 Z" fill="none" stroke="#d0d0d0" stroke-width="0.5"/>
  
  <!-- Image preview frame -->
  <rect x="12" y="14" width="24" height="18" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Ocean/landscape scene -->
  <rect x="13" y="15" width="22" height="16" rx="2" fill="#87ceeb"/>
  
  <!-- Sky gradient effect -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8d4f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4682b4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="13" y="15" width="22" height="16" rx="2" fill="url(#skyGradient)"/>
  
  <!-- Water/ocean -->
  <rect x="13" y="25" width="22" height="6" fill="#4682b4"/>
  
  <!-- Rocky elements -->
  <ellipse cx="17" cy="28" rx="2" ry="1.5" fill="#8b7355"/>
  <ellipse cx="24" cy="29" rx="1.5" ry="1" fill="#a0845c"/>
  <ellipse cx="31" cy="27" rx="1.8" ry="1.3" fill="#8b7355"/>
  
  <!-- White foam/waves -->
  <rect x="13" y="25" width="22" height="1" fill="#e6f3ff" opacity="0.7"/>
  
  <!-- Magnifying glass -->
  <circle cx="38" cy="38" r="6" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="38" cy="38" r="4.5" fill="rgba(255,255,255,0.9)" stroke="#777" stroke-width="0.5"/>
  <line x1="42.8" y1="42.8" x2="46.5" y2="46.5" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Handle detail on magnifying glass -->
  <circle cx="38" cy="38" r="2" fill="none" stroke="#999" stroke-width="0.5" opacity="0.5"/>
  
  <!-- PNG text -->
  <text x="24" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#666" text-anchor="middle">PNG</text>
</svg>