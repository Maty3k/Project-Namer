<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="200" height="200" fill="#0a0e27"/>

  <!-- Neon grid lines -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grid -->
  <g stroke="#ff006e" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)">
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="40" y1="140" x2="50" y2="200"/>
    <line x1="80" y1="140" x2="90" y2="200"/>
    <line x1="120" y1="140" x2="130" y2="200"/>
    <line x1="160" y1="140" x2="170" y2="200"/>
  </g>

  <!-- Neon shapes -->
  <g filter="url(#glow)">
    <rect x="60" y="50" width="80" height="60" fill="none" stroke="#00fff9" stroke-width="2" opacity="0.8"/>
    <circle cx="100" cy="80" r="20" fill="none" stroke="#8b00ff" stroke-width="2.5" opacity="0.9"/>
    <polygon points="100,70 110,90 90,90" fill="#ff006e" opacity="0.7"/>
  </g>

  <!-- Glitch effect lines -->
  <rect x="50" y="48" width="30" height="2" fill="#00fff9" opacity="0.8"/>
  <rect x="120" y="52" width="25" height="1" fill="#ff006e" opacity="0.9"/>
  <rect x="75" y="112" width="35" height="2" fill="#8b00ff" opacity="0.7"/>

  <!-- City silhouette -->
  <g fill="#1a1f3a" opacity="0.8">
    <rect x="20" y="160" width="25" height="40"/>
    <rect x="50" y="150" width="30" height="50"/>
    <rect x="85" y="165" width="20" height="35"/>
    <rect x="110" y="155" width="35" height="45"/>
    <rect x="150" y="170" width="25" height="30"/>
  </g>
</svg>
