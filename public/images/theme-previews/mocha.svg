<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#faf8f3"/>

  <!-- Coffee cup -->
  <ellipse cx="100" cy="140" rx="45" ry="8" fill="#8b6f47" opacity="0.3"/>
  <rect x="60" y="80" width="80" height="60" fill="#d4a574" rx="3"/>
  <path d="M 60 80 Q 100 75 140 80" fill="none" stroke="#a68a64" stroke-width="2"/>

  <!-- Coffee liquid -->
  <rect x="65" y="85" width="70" height="50" fill="#8b6f47" rx="2"/>

  <!-- Steam -->
  <path d="M 75 60 Q 70 45 75 30" fill="none" stroke="#a68a64" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <path d="M 100 55 Q 95 40 100 25" fill="none" stroke="#8b6f47" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 125 58 Q 120 43 125 28" fill="none" stroke="#a68a64" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- Cup handle -->
  <path d="M 140 95 Q 160 95 160 110 Q 160 125 140 125" fill="none" stroke="#a68a64" stroke-width="6" stroke-linecap="round"/>

  <!-- Coffee beans -->
  <ellipse cx="165" cy="165" rx="6" ry="9" fill="#4d3d28" transform="rotate(25 165 165)"/>
  <ellipse cx="180" cy="170" rx="6" ry="9" fill="#4d3d28" transform="rotate(-15 180 170)"/>
  <ellipse cx="172" cy="155" rx="5" ry="8" fill="#2d2416" transform="rotate(45 172 155)"/>
</svg>
