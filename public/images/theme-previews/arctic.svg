<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="arcticBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#arcticBg)"/>

  <!-- Ice crystals / snowflakes -->
  <g fill="#4db8ff" opacity="0.6">
    <path d="M100,40 L105,50 L95,50 Z"/>
    <path d="M100,60 L95,50 L105,50 Z"/>
    <circle cx="100" cy="50" r="3" fill="#00a8e8"/>
  </g>

  <g fill="#80d0ff" opacity="0.5" transform="translate(60, 80)">
    <path d="M0,0 L5,10 L-5,10 Z"/>
    <path d="M0,20 L-5,10 L5,10 Z"/>
    <circle cx="0" cy="10" r="2.5" fill="#4db8ff"/>
  </g>

  <g fill="#4db8ff" opacity="0.7" transform="translate(140, 100)">
    <path d="M0,0 L4,8 L-4,8 Z"/>
    <path d="M0,16 L-4,8 L4,8 Z"/>
    <circle cx="0" cy="8" r="2" fill="#00a8e8"/>
  </g>

  <!-- Icicles -->
  <polygon points="50,30 45,60 55,60" fill="#b3e0ff" opacity="0.8"/>
  <polygon points="150,50 145,75 155,75" fill="#80d0ff" opacity="0.8"/>
  <polygon points="30,90 26,110 34,110" fill="#4db8ff" opacity="0.7"/>
</svg>
